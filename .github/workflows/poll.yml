name: Poll

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Set to 1 to seed seen_posts without posting"
        required: false
        default: "0"
      dry_run:
        description: "Set to 1 to log what would be posted without posting or writing"
        required: false
        default: "0"
      max_posts:
        description: "Cap how many posts to publish/mark seen this run (0 = no cap)"
        required: false
        default: "0"

concurrency:
  group: poll-bot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-dev
      - run: uv run python bot.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EXCLUDE_STORES: ${{ vars.EXCLUDE_STORES }}
          BOOTSTRAP: ${{ github.event.inputs.bootstrap }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MAX_POSTS: ${{ github.event.inputs.max_posts || vars.MAX_POSTS }}
